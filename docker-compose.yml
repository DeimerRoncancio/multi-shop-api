services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: multishop
      MYSQL_USER: multishop
      MYSQL_PASSWORD: multishop
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-umultishop", "-pmultishop"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      media:
        condition: service_started
      catalog:
        condition: service_started
    env_file: .env
    environment:
      PORT: 8081
      DATABASE_NAME: multishop
      DATABASE_URL: jdbc:mysql://db:3306/multishop
      DATABASE_USERNAME: multishop
      DATABASE_PASSWORD: multishop
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:5173/cart/success}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:5173/cart/cancel}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      MEDIA_SERVICE_URL: http://media:8082
      CATALOG_SERVICE_URL: http://catalog:8083
      CLOUDINARY_CLOUD_NAME: ""
      CLOUDINARY_API_KEY: ""
      CLOUDINARY_API_SECRET: ""
    expose:
      - "8081"

  media:
    build:
      context: .
      dockerfile: media-service/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      PORT: 8082
      DATABASE_URL: jdbc:mysql://db:3306/multishop_media
      DATABASE_USERNAME: media
      DATABASE_PASSWORD: media
    ports:
      - "127.0.0.1:8082:8082"

  catalog:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      media:
        condition: service_started
    environment:
      PORT: 8083
      DATABASE_URL: jdbc:mysql://db:3306/multishop_catalog
      DATABASE_USERNAME: catalog
      DATABASE_PASSWORD: catalog
      DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET}
      MEDIA_SERVICE_URL: http://media:8082
    ports:
      - "127.0.0.1:8083:8083"

  gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    depends_on:
      - api
      - catalog
    environment:
      PORT: 8080
      MONOLITH_URL: http://api:8081
      CATALOG_URL: http://catalog:8083
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
    ports:
      - "8080:8080"

volumes:
  db-data:
