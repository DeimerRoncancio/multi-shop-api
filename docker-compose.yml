services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: multishop
      MYSQL_USER: multishop
      MYSQL_PASSWORD: multishop
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-umultishop", "-pmultishop"]
      interval: 5s
      timeout: 5s
      retries: 20

  transactions:
    build:
      context: .
      dockerfile: transactions-service/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      identity:
        condition: service_started
      catalog:
        condition: service_started
    environment:
      PORT: 8085
      DATABASE_URL: jdbc:mysql://db:3306/multishop_transactions
      DATABASE_USERNAME: transactions
      DATABASE_PASSWORD: transactions
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:5173/cart/success}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:5173/cart/cancel}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      IDENTITY_SERVICE_URL: http://identity:8084
      CATALOG_SERVICE_URL: http://catalog:8083
    expose:
      - "8085"

  media:
    build:
      context: .
      dockerfile: media-service/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8082
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      DATABASE_URL: jdbc:mysql://db:3306/multishop_media
      DATABASE_USERNAME: media
      DATABASE_PASSWORD: media
    ports:
      - "127.0.0.1:8082:8082"

  catalog:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      media:
        condition: service_started
    environment:
      PORT: 8083
      DATABASE_URL: jdbc:mysql://db:3306/multishop_catalog
      DATABASE_USERNAME: catalog
      DATABASE_PASSWORD: catalog
      DDL_AUTO: update
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      MEDIA_SERVICE_URL: http://media:8082
    ports:
      - "127.0.0.1:8083:8083"

  identity:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      media:
        condition: service_started
    environment:
      PORT: 8084
      DATABASE_URL: jdbc:mysql://db:3306/multishop_identity
      DATABASE_USERNAME: identity
      DATABASE_PASSWORD: identity
      DDL_AUTO: update
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      MEDIA_SERVICE_URL: http://media:8082
      CATALOG_SERVICE_URL: http://catalog:8083
    ports:
      - "127.0.0.1:8084:8084"

  gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    depends_on:
      - transactions
      - catalog
      - identity
    environment:
      PORT: 8080
      TRANSACTIONS_URL: http://transactions:8085
      CATALOG_URL: http://catalog:8083
      IDENTITY_URL: http://identity:8084
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
    ports:
      - "8080:8080"

volumes:
  db-data:
