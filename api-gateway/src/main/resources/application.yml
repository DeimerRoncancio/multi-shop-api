server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 30s
          globalcors:
            cors-configurations:
              "[/**]":
                allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
                allowed-methods: GET, POST, PUT, DELETE
                allowed-headers: Authorization, content-type, Token, X-Checkout-Access-Token
                allow-credentials: false
          default-filters:
            - RemoveRequestHeader=Origin
          routes:
            - id: catalog
              uri: ${CATALOG_URL:http://localhost:8083}
              predicates:
                - Path=/app/products, /app/products/**, /app/categories, /app/categories/**, /app/variants, /app/variants/**
            - id: monolith
              uri: ${MONOLITH_URL:http://localhost:8081}
              predicates:
                - Path=/app/**, /login, /v3/api-docs/**, /swagger-ui/**, /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
